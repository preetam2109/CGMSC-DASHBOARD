<div class="container-fluid mt-3">
  <!-- Nav tabs -->
  <ul class="nav nav-tabs" id="qcCourierTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link" [class.active]="activeTab === 'tab1'" (click)="setActiveTab('tab1')" type="button" role="tab">
        Sample In Transit to Lab
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" [class.active]="activeTab === 'tab2'" (click)="setActiveTab('tab2')" type="button" role="tab">
        Sample Delivery Pending at QC
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" [class.active]="activeTab === 'tab3'" (click)="setActiveTab('tab3')" type="button" role="tab">
        Sample Pickup Pending at QC
      </button>
    </li>
  </ul>

  <!-- Tab panes -->
  <div class="tab-content border-start border-end border-bottom p-3 bg-white" id="qcCourierTabContent">
    <div class="tab-pane fade" [class.show]="activeTab === 'tab1'" [class.active]="activeTab === 'tab1'" role="tabpanel" *ngIf="activeTab === 'tab1'">
      <app-sample-in-transit-to-lab></app-sample-in-transit-to-lab>
    </div>
    <div class="tab-pane fade" [class.show]="activeTab === 'tab2'" [class.active]="activeTab === 'tab2'" role="tabpanel" *ngIf="activeTab === 'tab2'">
      <app-sample-delivery-pending-at-qc></app-sample-delivery-pending-at-qc>
    </div>
    <div class="tab-pane fade" [class.show]="activeTab === 'tab3'" [class.active]="activeTab === 'tab3'" role="tabpanel" *ngIf="activeTab === 'tab3'">
      <app-sample-pickup-pending-at-qc></app-sample-pickup-pending-at-qc>
    </div>
  </div>
</div>
