

<iframe
    class="oac_embedding_iframe"
    style="height:485px; width:100%;" 
    srcdoc='
    <!DOCTYPE html>
    <html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OAC TEST</title>
        <script src="https://cgmscanalyticspro-cgmscee-t1-bo.analytics.ocp.oraclecloud.com/public/dv/v1/embedding/standalone/embedding.js" type="application/javascript"></script>
        <script>
          var token = "";

          function runWithRequireJS(callback) {
            if (typeof requirejs !== "undefined") {
              callback();
            } else {
              setTimeout(function() {
                runWithRequireJS(callback);
              }, 100);
            }
          }

          function fetchAndSetToken() {
            fetch("https://kcthepe5e6xwemxr36bzoz4xgq.apigateway.ap-mumbai-1.oci.customer-oci.com/oac/auth_token")
              .then(response => {
                if (!response.ok) {
                  throw new Error("HTTP error! status:"+response.status);
                }
                return response.json();
              })
              .then(data => {
                token = data.access_token;
                console.log("✅ Fetched OAC Token successfully:", token);

                runWithRequireJS(function() {
                  requirejs(["jquery", "knockout", "obitech-application/application","ojs/ojcore", "ojs/ojknockout", "ojs/ojcomposite", "jet-composites/oracle-dv/loader"], 
                  function($, ko, application) {
                    application.setSecurityConfig("token", {
                      tokenAuthFunction: function() {
                        return token;
                      }
                    });

                    if (!window.bindingsApplied) {
                      function MyProject() {
                        var self = this;
                        self.projectPath = ko.observable("/@Catalog/users/sm.cgmsc@gmail.com/Warehouse Stock");
                        self.parameters = ko.observableArray([]);
                      }
                      var targetNode = document.getElementById("oac-container") || document.body;
                      ko.applyBindings(new MyProject(), targetNode);
                      window.bindingsApplied = true;
                      
                      setTimeout(function() {
                        window.parent.postMessage("OAC_LOADED", "*");
                      }, 3000);
                    }
                  });
                });
              })
              .catch(error => {
                console.error("Error fetching token:", error);
              });
          }

          fetchAndSetToken();
          setInterval(fetchAndSetToken, 45 * 60 * 1000);
        </script>
    </head>
    <body>
      <div style="width: 100%; height:469px;">
        <oracle-dv project-path="/@Catalog/shared/Tender Status /TenderStatus" active-page="insight" active-tab-id="snapshot!canvas!1">
        </oracle-dv>
      </div>
    </body>
    </html>
    '>

</iframe>
